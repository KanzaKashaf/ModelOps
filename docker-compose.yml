services:
  # ── MLflow Tracking Server ──────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: modelops-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Serving API ─────────────────────────────────────────────────
  serving:
    build:
      context: .
      dockerfile: Dockerfile
    image: modelops-serving:${GIT_SHA:-local}
    container_name: modelops-serving
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      MODELOPS_MLFLOW_TRACKING_URI: http://mlflow:5000
      MODELOPS_MODEL_URI: models:/modelops-housing-regressor@champion
      MODELOPS_MODEL_NAME: modelops-housing-regressor
      MODELOPS_LOCAL_ARTIFACT_FALLBACK: /app/models/gradient_boosting.joblib
    volumes:
      # Model artifact directory, mounted read-only.
      # The model is NOT baked into the image.
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Prometheus (metrics scraping) ───────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: modelops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      serving:
        condition: service_healthy
    restart: unless-stopped

  # ── Grafana (dashboards) ────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.0.0
    container_name: modelops-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
