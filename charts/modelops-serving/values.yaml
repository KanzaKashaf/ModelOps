# Default values for modelops-serving.
# This file must produce a valid, runnable chart with no extra flags.

replicaCount: 1

image:
  repository: modelops-serving
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60

config:
  modelUri: ""
  modelName: "modelops-housing-regressor"
  localArtifactFallback: "/app/models/gradient_boosting.joblib"
  mlflowTrackingUri: ""
  logLevel: "INFO"

secret:
  enabled: false
  name: "modelops-secrets"

persistence:
  enabled: true
  storageClassName: manual
  accessMode: ReadOnlyMany
  size: 1Gi
  hostPath: "/models"
  existingClaim: ""

namespace:
  create: false
  name: modelops

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
