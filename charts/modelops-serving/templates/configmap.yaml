apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "modelops-serving.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "modelops-serving.labels" . | nindent 4 }}
data:
  MODELOPS_MODEL_URI: {{ .Values.config.modelUri | quote }}
  MODELOPS_MODEL_NAME: {{ .Values.config.modelName | quote }}
  MODELOPS_LOCAL_ARTIFACT_FALLBACK: {{ .Values.config.localArtifactFallback | quote }}
  MODELOPS_MLFLOW_TRACKING_URI: {{ .Values.config.mlflowTrackingUri | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
