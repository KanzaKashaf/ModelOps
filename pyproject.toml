[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelops"
version = "0.1.0"
description = "Production-style MLOps platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.11.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "pandera>=0.19.0",
    "joblib>=1.3.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.16.10",
    "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "modelops",
    "modelops.data",
    "modelops.training",
    "modelops.evaluation",
]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["modelops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
pythonpath = ["src"]