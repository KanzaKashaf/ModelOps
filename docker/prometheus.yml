global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: modelops

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: "modelops-serving"
    static_configs:
      - targets: ["serving:8000"]
    metrics_path: /metrics

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
