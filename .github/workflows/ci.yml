name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          python -m ruff --version
          python -m ruff check .

      - name: Run tests
        run: pytest

  data-and-model:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run validation and split tests
        run: pytest tests/test_validation.py tests/test_split.py -v
      - name: Run training (smoke test)
        run: |
          python -m modelops.training.train --seed 42
      - name: Verify model artifact exists
        run: test -f models/gradient_boosting.joblib
      - name: Run reload tests
        run: pytest tests/test_model_reload.py -v