name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v

  data-and-model:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run validation and split tests
        run: pytest tests/test_validation.py tests/test_split.py -v

      - name: Run training (smoke test)
        run: python -m modelops.training.train --seed 42

      - name: Verify model artifact exists
        run: test -f models/gradient_boosting.joblib

      - name: Run reload tests
        run: pytest tests/test_model_reload.py -v

  tracking-and-governance:
    runs-on: ubuntu-latest
    needs: data-and-model
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start MLflow server
        run: |
          nohup python -m mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            > mlflow_server.log 2>&1 &
          for i in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)" 2>/dev/null; then
              echo "MLflow is ready"
              break
            fi
            echo "Waiting for MLflow ($i/30)..."
            sleep 2
          done

      - name: Run tracking metadata tests
        run: pytest tests/test_metadata.py -v

      - name: Run promotion gate tests
        run: pytest tests/test_promotion.py -v

      - name: Train and log to MLflow
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python -m modelops.training.train_mlflow

      - name: Locate generated manifests
        id: manifests
        run: |
          GB_MANIFEST=$(ls manifests/gradient_boosting-v*.json | sort -V | tail -n1)
          RIDGE_MANIFEST=$(ls manifests/ridge-v*.json | sort -V | tail -n1)
          echo "gb=$GB_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "ridge=$RIDGE_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "Selected GB manifest: $GB_MANIFEST"
          echo "Selected Ridge manifest: $RIDGE_MANIFEST"

      - name: Verify gradient_boosting promotion approved (dry-run)
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python scripts/promote_model.py "${{ steps.manifests.outputs.gb }}" --dry-run

      - name: Verify Ridge promotion rejected (dry-run)
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          if python scripts/promote_model.py "${{ steps.manifests.outputs.ridge }}" --dry-run; then
            echo "ERROR: Ridge should have been rejected"
            exit 1
          else
            echo "Ridge correctly rejected"
          fi

      - name: Promote gradient_boosting to champion
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python scripts/promote_model.py "${{ steps.manifests.outputs.gb }}"

      - name: Upload MLflow server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-server-log
          path: mlflow_server.log