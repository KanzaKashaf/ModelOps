name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── 0. Change detection ─────────────────────────────────────────────
  # Gatekeeper job. Detects which paths changed and exposes boolean
  # outputs that downstream jobs use to decide whether to run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ml: ${{ steps.filter.outputs.ml }}
      security: ${{ steps.filter.outputs.security }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements-dev.lock'
              - '.github/workflows/ci.yml'
            ml:
              - 'src/modelops/data/**'
              - 'src/modelops/training/**'
              - 'src/modelops/evaluation/**'
              - 'src/modelops/governance/**'
              - 'src/modelops/serving/**'
              - 'tests/api/**'
              - 'tests/contracts/**'
              - 'tests/integration/**'
            security:
              - 'src/**'
              - 'pyproject.toml'
              - 'requirements-dev.lock'
              - 'bandit.yaml'
              - '.gitleaks.toml'
              - '.github/workflows/ci.yml'
            docs:
              - '**.md'
              - 'docs/**'

  # ── 1. Quality: lint + fast unit tests ─────────────────────────────
  quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Run fast unit tests
        run: |
          mkdir -p reports
          pytest tests/ -v \
            --ignore=tests/api \
            --ignore=tests/contracts \
            --ignore=tests/integration \
            --ignore=tests/test_model_reload.py \
            --json-report --json-report-file=reports/pytest-unit.json
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-report
          path: reports/pytest-unit.json
          if-no-files-found: ignore

  # ── 2. Data and model: training pipeline ──────────────────────────
  data-and-model:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.ml == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run validation and split tests
        run: pytest tests/test_validation.py tests/test_split.py -v
      - name: Run training (smoke test)
        run: python -m modelops.training.train --seed 42
      - name: Verify model artifact exists
        run: test -f models/gradient_boosting.joblib
      - name: Run reload tests
        run: pytest tests/test_model_reload.py -v

  # ── 3. Tracking and governance: MLflow + promotion ─────────────────
  tracking-and-governance:
    runs-on: ubuntu-latest
    needs: [changes, data-and-model]
    if: needs.changes.outputs.ml == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start MLflow server
        run: |
          mkdir -p mlruns
          nohup python -m mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            > mlflow_server.log 2>&1 &
          for i in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)" 2>/dev/null; then
              echo "MLflow is ready"
              break
            fi
            echo "Waiting for MLflow ($i/30)..."
            sleep 2
          done
      - name: Run tracking and promotion tests
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: pytest tests/test_promotion.py tests/test_metadata.py -v
      - name: Train and log to MLflow
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python -m modelops.training.train_mlflow
      - name: Locate generated manifests
        id: manifests
        run: |
          GB=$(ls manifests/gradient_boosting-v*.json | sort -V | tail -n1)
          RIDGE=$(ls manifests/ridge-v*.json | sort -V | tail -n1)
          echo "gb=$GB" >> "$GITHUB_OUTPUT"
          echo "ridge=$RIDGE" >> "$GITHUB_OUTPUT"
          echo "Selected GB manifest: $GB"
          echo "Selected Ridge manifest: $RIDGE"
      - name: Verify gradient_boosting promotion approved (dry-run)
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python scripts/promote_model.py "${{ steps.manifests.outputs.gb }}" --dry-run
      - name: Verify Ridge promotion rejected (dry-run)
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          if python scripts/promote_model.py "${{ steps.manifests.outputs.ridge }}" --dry-run; then
            echo "ERROR: Ridge should have been rejected"
            exit 1
          else
            echo "Ridge correctly rejected"
          fi
      - name: Promote gradient_boosting to champion
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python scripts/promote_model.py "${{ steps.manifests.outputs.gb }}"
      - name: Upload MLflow server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-server-log
          path: mlflow_server.log
          if-no-files-found: ignore

  # ── 4. Serving API: contract tests ─────────────────────────────────
  serving-api:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.ml == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run serving API contract tests
        run: |
          mkdir -p reports
          pytest tests/api -v --json-report --json-report-file=reports/pytest-api.json
      - name: Verify OpenAPI schema loads
        run: |
          python -c "
          from modelops.serving.app import create_app
          schema = create_app().openapi()
          for path in ['/v1/predict', '/health/live', '/health/ready', '/v1/model/info']:
              assert path in schema['paths'], f'{path} missing'
          print('OpenAPI schema OK')
          "
      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-api-report
          path: reports/pytest-api.json
          if-no-files-found: ignore

  # ── 5. Model-contract: schema alignment ────────────────────────────
  model-contract:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.ml == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run model-contract tests
        run: pytest tests/contracts -v

  # ── 6. Security scan: SAST, SCA, secrets ───────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and security tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Create reports directory
        run: mkdir -p reports

      # ── SAST: Bandit ───────────────────────────────────────────────
      - name: Bandit (SAST) — generate report
        run: bandit -c bandit.yaml -r src/ -lll -f json -o reports/bandit.json
      - name: Bandit (SAST) — fail on HIGH severity
        run: bandit -c bandit.yaml -r src/ -lll
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit.json
          if-no-files-found: ignore

      # ── SCA: pip-audit ─────────────────────────────────────────────
      - name: pip-audit (SCA)
        run: pip-audit -r requirements-dev.lock --desc -f json -o reports/pip_audit.json
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip_audit.json
          if-no-files-found: ignore

      # ── Secrets: Gitleaks ──────────────────────────────────────────
      # The action reads .gitleaks.toml from the repo root automatically.
      # GITLEAKS_LICENSE is only required for organization accounts.
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 7. Test report aggregation ─────────────────────────────────────
  test-report:
    runs-on: ubuntu-latest
    needs: [changes, quality, serving-api]
    if: always() && needs.changes.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Download test reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: reports/
      - name: Summarize test results
        run: |
          echo "## Test Report Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Report | Passed | Failed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          found_any=0
          for f in reports/pytest-unit-report/pytest-unit.json reports/pytest-api-report/pytest-api.json; do
            if [ -f "$f" ]; then
              found_any=1
              NAME=$(basename "$f")
              PASSED=$(python -c "import json; d=json.load(open('$f')); print(d['summary'].get('passed', 0))" 2>/dev/null || echo "?")
              FAILED=$(python -c "import json; d=json.load(open('$f')); print(d['summary'].get('failed', 0))" 2>/dev/null || echo "?")
              echo "| $NAME | $PASSED | $FAILED |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "| (no test reports available) | - | - |" >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.ml == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t modelops-serving:ci-${{ github.sha }} .

      - name: Verify non-root user
        run: |
          USER=$(docker run --rm --entrypoint whoami modelops-serving:ci-${{ github.sha }})
          [ "$USER" = "appuser" ] || { echo "Not running as appuser"; exit 1; }
          echo "Verified: container runs as appuser"

      - name: Verify API starts and responds
        run: |
          docker run -d --name test-serving \
            -p 8000:8000 \
            modelops-serving:ci-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health/live > /dev/null; then
              echo "Liveness passed after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health/live
          docker stop test-serving
          docker rm test-serving